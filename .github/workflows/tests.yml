name: Testing

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  audit:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Tap repository
        run: brew tap --custom-remote tidbcloud/tap "$GITHUB_WORKSPACE"
      - name: Audit formula
        run: brew audit --strict --online tidbcloud/tap/lakesql

  smoke:
    needs: audit
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Tap repository
        run: brew tap --custom-remote tidbcloud/tap "$GITHUB_WORKSPACE"
      - name: Install formula
        run: brew install tidbcloud/tap/lakesql
      - name: Smoke test binary
        run: brew test tidbcloud/tap/lakesql
